name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          if [ ! -f proyecto.zip ]; then echo "Falta proyecto.zip en la raíz del repositorio"; exit 1; fi
          mkdir proj
          unzip -q proyecto.zip -d proj

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Lite-Launcher-debug
          path: proj/app/build/outputs/apk/debug/*.apk
          
